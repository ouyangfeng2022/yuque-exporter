<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语雀批量导出插件</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 260px;
      padding: 24px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
    }

    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      background: #f3f4f6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon img {
      width: 42px;
      height: 42px;
    }

    h1 {
      font-size: 15px;
      margin-bottom: 6px;
      color: #111827;
      font-weight: 500;
    }

    p {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .hint {
      margin-top: 14px;
      padding: 8px 12px;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="icon"><img src="icons/icon48.png" alt="logo"></div>
  <h1>语雀批量导出插件</h1>
  <p>导出面板已自动显示在语雀页面右上角</p>
  <div class="hint">
    打开任意语雀页面即可使用
  </div>
</body>

</html>
